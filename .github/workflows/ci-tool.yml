name: Verify Python Tool

on:
  push:
    branches: [main]
    paths:
      - "screenshare_tool/**"
      - ".github/workflows/ci-tool.yml"
  pull_request:
    branches: [main]
    paths:
      - "screenshare_tool/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all modules
        run: python -m compileall -q screenshare_tool

      - name: Verify imports
        run: |
          python -c "
          from screenshare_tool import config, utils, system, network, bam, cheat, minecraft, registry, journal, prefetch, macro, nick_search, events, dashboard
          print('All modules imported successfully')
          "

      - name: Check cheat list count
        run: |
          python -c "
          from screenshare_tool.config import KNOWN_CHEATS
          count = len(KNOWN_CHEATS)
          print(f'Known cheats: {count}')
          assert count >= 40, f'Expected at least 40 cheats, got {count}'
          "
