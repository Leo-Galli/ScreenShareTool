name: Emoji Cleaner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # Run daily at 3 AM UTC

jobs:
  clean-emojis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect and remove emojis
        id: emoji-clean
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import subprocess

          # Emoji regex pattern - covers all common emoji ranges
          EMOJI_RE = re.compile(
              "["
              "\U0001F600-\U0001F64F"  # emoticons
              "\U0001F300-\U0001F5FF"  # symbols & pictographs
              "\U0001F680-\U0001F6FF"  # transport & map
              "\U0001F1E0-\U0001F1FF"  # flags
              "\U0001F900-\U0001F9FF"  # supplemental symbols
              "\U0001FA00-\U0001FA6F"  # chess symbols
              "\U0001FA70-\U0001FAFF"  # symbols extended-A
              "\U00002702-\U000027B0"  # dingbats
              "\U0000FE00-\U0000FE0F"  # variation selectors
              "\U0000200D"             # zero width joiner
              "\U000025A0-\U000025FF"  # geometric shapes
              "\U00002600-\U000026FF"  # misc symbols
              "\U00002700-\U000027BF"  # dingbats
              "\U0000231A-\U0000231B"  # watch, hourglass
              "\U000023E9-\U000023F3"  # clocks
              "\U000023F8-\U000023FA"  # controls
              "\U00002934-\U00002935"  # arrows
              "\U000025AA-\U000025AB"  # squares
              "\U000025B6"             # play
              "\U000025C0"             # reverse
              "\U000025FB-\U000025FE"  # squares
              "\U00002B05-\U00002B07"  # arrows
              "\U00002B1B-\U00002B1C"  # squares
              "\U00002B50"             # star
              "\U00002B55"             # circle
              "\U00003030"             # wavy dash
              "\U0000303D"             # part alternation mark
              "\U00003297"             # circled ideograph congratulation
              "\U00003299"             # circled ideograph secret
              "]+",
              flags=re.UNICODE,
          )

          # Files to scan
          EXTENSIONS = {".py", ".ts", ".tsx", ".js", ".jsx", ".md", ".yml", ".yaml", ".json", ".html", ".css", ".sh", ".bat"}
          SKIP_DIRS = {".git", "node_modules", ".next", "__pycache__", "dist", "build", ".vercel"}

          changed_files = []
          removed_count = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for fname in files:
                  ext = os.path.splitext(fname)[1].lower()
                  if ext not in EXTENSIONS:
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                  except (IOError, UnicodeDecodeError):
                      continue

                  matches = EMOJI_RE.findall(content)
                  if matches:
                      new_content = EMOJI_RE.sub("", content)
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      removed_count += len(matches)
                      changed_files.append(fpath)
                      print(f"  Removed {len(matches)} emoji(s) from {fpath}")

          if changed_files:
              print(f"\nTotal: removed {removed_count} emoji(s) from {len(changed_files)} file(s)")
              with open("changed_files.txt", "w") as f:
                  for fp in changed_files:
                      f.write(fp + "\n")
              exit(0)
          else:
              print("No emojis found!")
              exit(1)
          PYEOF

      - name: Commit and push changes
        if: success() && steps.emoji-clean.outcome == 'success'
        run: |
          if [ -f changed_files.txt ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "Emoji Cleaner Bot"
            git add -A
            git commit -m "$(cat <<'EOF'
            chore: remove emojis from codebase

            Auto-detected and removed emojis from the following files:
            $(cat changed_files.txt | sed 's/^/- /')

            Generated with Codebuff
            Co-Authored-By: Codebuff <noreply@codebuff.com>
            EOF
            )"
            git push
            rm -f changed_files.txt
          fi
