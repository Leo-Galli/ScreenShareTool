name: Verify Linux Strings

on:
  push:
    branches: [main]
    paths:
      - "website/src/app/strings/**"
      - ".github/workflows/verify-strings-linux.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/src/app/strings/**"
  schedule:
    - cron: "0 7 * * 1"

jobs:
  verify-linux-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract and validate Linux strings
        run: |
          python3 << 'PYEOF'
          import re

          with open("website/src/app/strings/page.tsx", "r", encoding="utf-8") as f:
              content = f.read()

          linux_strings = []
          in_linux = False

          for line in content.split("\n"):
              if 'os: "Linux"' in line:
                  in_linux = True
              elif "os: \"" in line and "Linux" not in line:
                  in_linux = False
              elif in_linux:
                  matches = re.findall(r'"([^"]+)"', line)
                  for m in matches:
                      if m and len(m) > 1 and not m.startswith("bg-") and not m.startswith("text-"):
                          linux_strings.append(m)

          print(f"Found {len(linux_strings)} Linux strings")

          # Validate paths
          paths = [s for s in linux_strings if s.startswith("/") or s.startswith("~/")]
          print(f"\nFile paths: {len(paths)}")
          for p in paths:
              print(f"  {p}")

          # Check for common forensic artifacts
          artifacts = {
              "System logs (/var/log)": any("/var/log" in s for s in linux_strings),
              "Bash history": any("bash_history" in s for s in linux_strings),
              "Trash": any("Trash" in s for s in linux_strings),
              "Proc filesystem": any("/proc/" in s for s in linux_strings),
              "Minecraft paths": any(".minecraft" in s for s in linux_strings),
              "Forensic tools (lsof, strace)": any(s in linux_strings for s in ["lsof", "strace", "fuser"]),
          }

          print("\n--- Artifact Coverage ---")
          all_pass = True
          for artifact, found in artifacts.items():
              status = "PASS" if found else "FAIL"
              if not found:
                  all_pass = False
              print(f"  {artifact}: {status}")

          if all_pass:
              print("\nAll Linux forensic artifacts covered!")
          else:
              print("\nSome artifacts missing!")
              exit(1)
          PYEOF
